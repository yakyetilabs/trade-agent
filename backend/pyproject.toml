[project]
name = "trade-agent-backend"
version = "0.1.0"
description = "Vendor-scoped, trade-compliance-isolated agent backend (FastAPI + LangGraph)"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.7",
    "firebase-admin>=6.5",
    "google-cloud-firestore>=2.16",
    # Knowledge-base phase: Vertex embeddings (the embedder) + Pinecone (the dumb
    # vector bucket), both via their LangChain wrappers. langchain-google-vertexai
    # pulls in google-cloud-aiplatform (the raw `vertexai` SDK fallback for 768-dim
    # embeddings); langchain-pinecone pulls in the Pinecone client.
    "langchain-google-vertexai>=2.0",
    "langchain-pinecone>=0.2",
]

# The LangGraph agent runtime deps are added in the agent phase (Phase 3).

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
    "pyright>=1.1.370",
]

[tool.uv]
# Flat-src application, not a distributable package: install deps, don't build `src`.
package = false

[tool.pytest.ini_options]
# Run from backend/ so `src.` imports resolve; co-located test_*.py files.
pythonpath = ["."]
testpaths = ["src"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are the intended idiom in arg defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Security",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
