[project]
name = "trade-agent-backend"
version = "0.1.0"
description = "Vendor-scoped, trade-compliance-isolated agent backend (FastAPI + LangGraph)"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.7",
    "firebase-admin>=6.5",
    "google-cloud-firestore>=2.16",
    # Model + KB layer: chat via langchain-google-genai (ChatGoogleGenerativeAI on Vertex,
    # vertexai=True); embeddings via the raw google-genai embed_content call (explicit
    # 768-dim); stored and queried through the Pinecone vector store.
    "langchain-google-genai>=4.2.6",
    "google-genai>=2.10.0",
    "langchain-pinecone>=0.2",
    # Agent phase: LangGraph state machine + ToolRuntime vendor scoping. The agent loop
    # itself is built with langchain.agents.create_agent (the LangChain 1.0 successor to
    # the deprecated langgraph.prebuilt.create_react_agent); a model instance is passed in,
    # so no provider package (e.g. langchain-openai) is pulled in as a dependency.
    "langgraph>=0.6",
    "langchain>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
    "pyright>=1.1.370",
]

[tool.uv]
# Flat-src application, not a distributable package: install deps, don't build `src`.
package = false

[tool.pytest.ini_options]
# Run from backend/ so `src.` imports resolve; co-located test_*.py files.
pythonpath = ["."]
testpaths = ["src", "eval"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are the intended idiom in arg defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Security",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
# API-currency gate: flag any use of a deprecated library API as an error, so drift
# like the langchain-google-vertexai deprecation is caught in the shared config (the
# editor's basedpyright reads this same section) rather than by luck.
reportDeprecated = "error"
venvPath= "."
venv = ".venv"
